# NOTE: This raw manifest does not include DB init scripts.
# Use the Helm chart (helm/sports-betting-platform) for a complete deployment
# with automatic table creation and seed data via ConfigMap.


apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: database
  namespace: sports-betting-dev
spec:
  serviceName: database
  replicas: 1
  selector:
    matchLabels:
      app: database
  template:
    metadata:
      labels:
        app: database
    spec:
      containers:
      - name: database
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        envFrom:
        - secretRef:
            name: database-secret
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - sportsuser
            - -d
            - sportsdb
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - sportsuser
            - -d
            - sportsdb
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc