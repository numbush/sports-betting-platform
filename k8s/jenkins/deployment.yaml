# Jenkins runs inside the cluster and builds images via the host Docker socket (Docker-outside-of-Docker pattern)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins
  namespace: devops-tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jenkins
  template:
    metadata:
      labels:
        app: jenkins
    spec:
      serviceAccountName: jenkins  # SA token is what Helm/kubectl use for in-cluster deploys
      initContainers:
      - name: fix-permissions
        image: alpine
        command:
        - sh
        - -c
        - |
          chmod 777 /var/run/docker.sock  # allows jenkins user to talk to host Docker daemon (security tradeoff)
          chown -R 1000:1000 /var/jenkins_home
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: jenkins-storage
          mountPath: /var/jenkins_home
        - name: docker-socket
          mountPath: /var/run/docker.sock
      containers:
      - name: jenkins
        image: jenkins-with-docker:v4
        imagePullPolicy: Never  # custom image — must be built locally and loaded into minikube
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 50000
          name: agent
        volumeMounts:
        - name: jenkins-storage
          mountPath: /var/jenkins_home
        - name: docker-socket
          mountPath: /var/run/docker.sock
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        readinessProbe:
          httpGet:
            path: /login
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /login
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 10
      volumes:
      - name: jenkins-storage
        persistentVolumeClaim:
          claimName: jenkins-pvc
      - name: docker-socket
        hostPath:
          path: /var/run/docker.sock  # mounts the node's Docker socket into the pod