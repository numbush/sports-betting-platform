apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: sports-betting-dev
type: Opaque
data:
  # Generate with: echo -n "yourvalue" | base64
  # WARNING: These are dev-only credentials. In production use External Secrets Operator.
  # echo -n "sportsuser" | base64 = c3BvcnRzdXNlcg==
  # echo -n "sportspassword" | base64 = c3BvcnRzcGFzc3dvcmQ=
  DB_USER: c3BvcnRzdXNlcg==
  DB_PASSWORD: c3BvcnRzcGFzc3dvcmQ=