# Nginx acts as a reverse proxy so the browser uses same-origin /api/* URLs.
# This avoids baking a backend IP into the React build (CRA env vars are compile-time only).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Trailing slash on proxy_pass strips /api/ prefix: /api/games → backend:8000/games
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        # SPA fallback — React Router (if added) would need this for client-side routes
        try_files $uri $uri/ /index.html;
    }
}