apiVersion: v1
kind: ConfigMap
metadata:
  name: db-init-scripts
  namespace: {{ .Values.namespace }}
data:
  01-init.sql: |
    \c {{ .Values.database.credentials.name }};
    CREATE TABLE IF NOT EXISTS games (
      id SERIAL PRIMARY KEY,
      home_team VARCHAR(100) NOT NULL,
      away_team VARCHAR(100) NOT NULL,
      odds_home DECIMAL(4,2) NOT NULL,
      odds_away DECIMAL(4,2) NOT NULL,
      created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );
    CREATE TABLE IF NOT EXISTS bets (
      id SERIAL PRIMARY KEY,
      game_id INTEGER REFERENCES games(id),
      team_chosen VARCHAR(100) NOT NULL,
      amount DECIMAL(10,2) NOT NULL,
      created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );
  02-seed.sql: |
    \c {{ .Values.database.credentials.name }};
    INSERT INTO games (home_team, away_team, odds_home, odds_away)
    SELECT 'Real Madrid', 'Barcelona', 2.1, 3.5
    WHERE NOT EXISTS (SELECT 1 FROM games WHERE home_team='Real Madrid');
    INSERT INTO games (home_team, away_team, odds_home, odds_away)
    SELECT 'Liverpool', 'Man City', 2.8, 2.4
    WHERE NOT EXISTS (SELECT 1 FROM games WHERE home_team='Liverpool');
    INSERT INTO games (home_team, away_team, odds_home, odds_away)
    SELECT 'PSG', 'Bayern Munich', 3.0, 2.2
    WHERE NOT EXISTS (SELECT 1 FROM games WHERE home_team='PSG');