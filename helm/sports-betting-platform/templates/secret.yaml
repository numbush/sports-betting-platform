# Single secret serves both Postgres (POSTGRES_*) and backend (DB_*) — avoids credential drift
apiVersion: v1
kind: Secret
metadata:
  name: database-secret
  namespace: {{ .Values.namespace }}
type: Opaque
data:
  POSTGRES_USER: {{ .Values.database.credentials.user | b64enc }}
  POSTGRES_PASSWORD: {{ .Values.database.credentials.password | b64enc }}
  POSTGRES_DB: {{ .Values.database.credentials.name | b64enc }}
  DB_USER: {{ .Values.database.credentials.user | b64enc }}
  DB_PASSWORD: {{ .Values.database.credentials.password | b64enc }}